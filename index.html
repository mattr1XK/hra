<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Chase</title>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <audio id="bgm-menu" src="menu-music.mp3" loop></audio>
    <audio id="bgm-game" src="game-music.mp3" loop></audio>
    <audio id="bgm-secret" src="TIKI TIKI.mp3" loop></audio>

    <div id="mainMenu" class="screen active">
        <div class="menu-left">
            <h1>Neon<br>Chase</h1>
            <p>Preži vlnu neónových predátorov</p>
            <button id="startBtn">Spustiť hru</button>
            <button id="openSettingsBtn" style="margin-top: 15px; border: 2px solid rgba(0, 255, 255, 0.4); background: rgba(0,0,0,0.5); color: #00ffff;">Nastavenia</button>
        </div>
        
        <div class="menu-right">
            <div>
                <h3>Vyber si Glow Skin</h3>
                <div id="skinsContainer"></div>
            </div>
            <div>
                <h3>Top 5 Rekordy</h3>
                <ul id="mainLeaderboard" class="leaderboard"></ul>
            </div>
        </div>
    </div>

    <div id="settingsScreen" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.85); z-index: 9999; align-items: center; justify-content: center;">
        <div style="background: rgba(10, 10, 20, 0.95); padding: 40px; border: 2px solid #00ffff; border-radius: 15px; box-shadow: 0 0 30px rgba(0, 255, 255, 0.3); width: 400px; text-align: center;">
            <h2 style="font-size: 2.5rem; color: #00ffff; text-shadow: 0 0 15px #00ffff; margin-bottom: 30px;">NASTAVENIA</h2>
            
            <div style="margin-bottom: 25px; text-align: left;">
                <label for="volumeSlider" style="display: block; font-size: 1.2rem; color: #fff; margin-bottom: 10px;">Hlasitosť hry:</label>
                <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="0.4" style="width: 100%; cursor: pointer;">
            </div>
            
            <div style="margin-bottom: 35px; display: flex; justify-content: space-between; align-items: center; text-align: left;">
                <label for="motionToggle" style="font-size: 1.2rem; color: #fff;">Ovládanie myšou:</label>
                <input type="checkbox" id="motionToggle" style="width: 25px; height: 25px; cursor: pointer;">
            </div>

            <button id="secretBtn" class="big-red-btn">...</button>
            
            <button id="closeSettingsBtn" style="margin-top: 25px; width: 100%; padding: 12px; font-size: 1.2rem; background: transparent; border: 2px solid #555; color: #ccc; cursor: pointer; border-radius: 5px; transition: 0.2s;">X Späť do menu</button>
        </div>
    </div>

    <div id="gameOverScreen" class="screen">
        <div style="text-align: center; width: 100%;">
            <h1 style="font-size: 2.5rem; text-shadow: 0 0 15px #ff0033;">Koniec Hry</h1>
            <p style="font-size: 1.2rem; margin-bottom: 20px;">Dosiahnuté skóre: <span id="finalScore" style="color:#00ffff; font-weight:bold;">0</span></p>
            <p style="font-size: 1.1rem; margin-bottom: 30px;">Čas prežitia: <span id="finalTime" style="color:#ff00ff; font-weight:bold;">0.0</span>s</p>
            
            <h3>Tvoje maximum</h3>
            <ul id="gameOverLeaderboard" class="leaderboard" style="margin-bottom: 25px;"></ul>
            
            <button id="retryBtn">Skúsiť znova</button>
            <button id="menuBtn">Hlavné menu</button>
        </div>
    </div>

    <div id="hud">
        <div class="hud-panel">
            <div>SCORE: <span id="scoreVal">0</span><span id="multiplierDisp" class="hidden">x2</span></div>
            <div>TIME: <span id="timeVal">0.0</span>s</div>
        </div>
        <div class="hud-panel">
            <div>PHASE: <span id="lvlVal">1</span></div>
        </div>
    </div>

    <div id="powerupAlert"></div>
    
    <canvas id="gameCanvas"></canvas>

    <script src="game.js"></script>
</body>
</html>
